[package]
name = "meshag-python"
version = "0.1.0"
edition = "2021"

[lib]
name = "meshag"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module"] }
tokio = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
meshag-shared = { path = "../shared" }
meshag-orchestrator = { path = "../orchestrator" }

[lints]
workspace = true
